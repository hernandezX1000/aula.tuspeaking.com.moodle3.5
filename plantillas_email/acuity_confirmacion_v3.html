<table cellpadding="0" cellspacing="0" width="100%" border="0" style="max-width:500px;padding:30px 10px;" class="container" align="center">
<tbody>
<tr>
	<td style="padding:25px 30px;margin:0;border:1px solid #e0e0e0;border-radius:8px;" class="padding-wrapper" bgcolor="#ffffff">
		
		<!-- Logo -->
		<table border="0" cellpadding="0" cellspacing="0" style="width:100%;">
		<tbody>
		<tr>
			<td align="center" style="padding:10px 0 25px 0;">
				<img src="https://cdn-s.acuityscheduling.com/upload-c9eec1dba0fbb73e319e86b3c488cd34.png" width="180" height="74" alt="tuSpeaking" style="width:180px;height:auto;display:block;">
			</td>
		</tr>
		</tbody>
		</table>
		
		<!-- Header con fondo turquesa -->
		<table border="0" cellpadding="0" cellspacing="0" style="width:100%;background:#008ba3;border-radius:6px;">
		<tbody>
		<tr>
			<td align="center" style="padding:20px 15px 8px 15px;font-size:24px;font-family:'Segoe UI',Arial,sans-serif;color:#ffffff;font-weight:600;">
				&#10003; Sesi&oacute;n Programada
			</td>
		</tr>
		<tr>
			<td align="center" style="padding:0 15px 20px 15px;font-size:18px;font-family:'Segoe UI',Arial,sans-serif;color:#ffffff;">
				para %first% %last%
			</td>
		</tr>
		</tbody>
		</table>
		
		<!-- Detalles de la sesion -->
		<table cellspacing="0" cellpadding="0" width="100%" style="margin-top:25px;background:#f8f9fa;border-radius:6px;">
		<tbody>
		<tr>
			<td style="padding:18px 20px;font-size:14px;font-family:'Segoe UI',Arial,sans-serif;color:#666666;border-bottom:1px solid #e9ecef;" valign="top" width="80">
				<strong>Tipo</strong>
			</td>
			<td style="padding:18px 20px;font-size:16px;font-family:'Segoe UI',Arial,sans-serif;color:#333333;border-bottom:1px solid #e9ecef;">
				%type%<br><span style="font-size:13px;color:#666;">(%calendar%)</span>
			</td>
		</tr>
		<tr>
			<td style="padding:18px 20px;font-size:14px;font-family:'Segoe UI',Arial,sans-serif;color:#666666;border-bottom:1px solid #e9ecef;" valign="top" width="80">
				<strong>Cu&aacute;ndo</strong>
			</td>
			<td style="padding:18px 20px;font-size:16px;font-family:'Segoe UI',Arial,sans-serif;color:#333333;border-bottom:1px solid #e9ecef;">
				%time%<br><span style="font-size:13px;color:#666;">(%duration%)</span>
			</td>
		</tr>
		<tr>
			<td style="padding:18px 20px;font-size:14px;font-family:'Segoe UI',Arial,sans-serif;color:#666666;" valign="top" width="80">
				<strong>D&oacute;nde</strong>
			</td>
			<td style="padding:18px 20px;font-size:16px;font-family:'Segoe UI',Arial,sans-serif;color:#333333;">
				%location%
			</td>
		</tr>
		</tbody>
		</table>
		
		<!-- Mensaje de confirmacion -->
		<table cellspacing="0" cellpadding="0" width="100%">
		<tbody>
		<tr>
			<td align="center" style="padding:25px 10px 20px 10px;font-size:15px;line-height:22px;font-family:'Segoe UI',Arial,sans-serif;color:#555555;">
				&iexcl;Gracias! Tu sesi&oacute;n ha sido programada correctamente.
			</td>
		</tr>
		</tbody>
		</table>
		
		<!-- Botones -->
		<table cellpadding="0" cellspacing="0" border="0" align="center" width="100%">
		<tbody>
		<tr>
			<td align="center" style="padding:8px 0;">
				<table cellpadding="0" cellspacing="0" border="0">
				<tr>
					<td bgcolor="#008ba3" height="44" width="280" style="color:#FFFFFF;font-family:'Segoe UI',Arial,sans-serif;border-radius:6px;font-size:14px;font-weight:500;" align="center" valign="middle">
						<a href="%viewhref%" style="color:#FFFFFF;text-decoration:none;display:block;padding:12px 20px;">Modificar/Cancelar Sesi&oacute;n</a>
					</td>
				</tr>
				</table>
			</td>
		</tr>
		<tr>
			<td align="center" style="padding:8px 0;">
				<table cellpadding="0" cellspacing="0" border="0">
				<tr>
					<td bgcolor="#00bcd4" height="44" width="280" style="color:#FFFFFF;font-family:'Segoe UI',Arial,sans-serif;border-radius:6px;font-size:14px;font-weight:500;" align="center" valign="middle">
						<a href="%exporthref%" style="color:#FFFFFF;text-decoration:none;display:block;padding:12px 20px;">A&ntilde;adir a iCal/Outlook</a>
					</td>
				</tr>
				</table>
			</td>
		</tr>
		<tr>
			<td align="center" style="padding:8px 0;">
				<table cellpadding="0" cellspacing="0" border="0">
				<tr>
					<td bgcolor="#00bcd4" height="44" width="280" style="color:#FFFFFF;font-family:'Segoe UI',Arial,sans-serif;border-radius:6px;font-size:14px;font-weight:500;" align="center" valign="middle">
						<a href="%googlehref%" style="color:#FFFFFF;text-decoration:none;display:block;padding:12px 20px;">A&ntilde;adir a Google Calendar</a>
					</td>
				</tr>
				</table>
			</td>
		</tr>
		</tbody>
		</table>
		
		<!-- Nota horarios -->
		<table cellspacing="0" cellpadding="0" width="100%" style="margin-top:20px;border-top:1px solid #e9ecef;">
		<tbody>
		<tr>
			<td align="center" style="padding:20px 10px 5px 10px;font-size:11px;line-height:16px;font-family:'Segoe UI',Arial,sans-serif;color:#999999;">
				<strong>Nota sobre horarios:</strong><br>
				CEST = Madrid | WEST = Canarias
			</td>
		</tr>
		</tbody>
		</table>
		
	</td>
</tr>
</tbody>
</table>
